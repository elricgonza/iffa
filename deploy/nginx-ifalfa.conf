server {
    listen 80;
    server_name ifalfa.example.com;      # cambiar por su dominio

    client_max_body_size 5m;

    location / {
        proxy_pass http://unix:/run/ifalfa/ifalfa.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
# Active HTTPS con:  sudo certbot --nginx -d ifalfa.example.com
# y luego en .env:   SESSION_COOKIE_SECURE=1  y  TRUST_PROXY=1
