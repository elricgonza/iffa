{% extends 'base.html' %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<div class="card mx-auto mt-10 max-w-md p-10 text-center">
  <img src="{{ url_for('static', filename='img/logo-sm.png') }}" alt="" class="mx-auto h-16 w-auto opacity-90">
  <p class="mt-4 text-5xl font-bold text-brand-600">{{ code }}</p>
  <p class="mt-3 text-slate-600">{{ msg }}</p>
  <a href="{{ url_for('main.inicio') }}" class="btn btn-primary mt-6">Volver al inicio</a>
</div>
{% endblock %}
