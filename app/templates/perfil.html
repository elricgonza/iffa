{% extends 'base.html' %}
{% block title %}Mi perfil{% endblock %}
{% block content %}
<h1 class="text-xl font-bold text-brand-800 mb-4">Mi perfil</h1>
<div class="max-w-md bg-white rounded-xl shadow-sm border p-5 space-y-4">
  <p class="text-sm"><span class="text-slate-500">Usuario:</span> <strong>{{ current_user.usuario }}</strong><br>
  <span class="text-slate-500">Correo:</span> {{ current_user.email }}<br>
  <span class="text-slate-500">Roles:</span> {{ current_user.roles|join(', ') or '—' }}</p>
  <a href="{{ url_for('auth.cambiar_password') }}"
     class="inline-block rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm px-4 py-2">Cambiar contraseña</a>
</div>
{% endblock %}
