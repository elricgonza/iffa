<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token() }}">
<meta name="theme-color" content="#193B68">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = { theme: { extend: {
    fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'] },
    colors: { brand: {
      50:'#EDF4FD',100:'#D7E6FA',200:'#A8C7F0',300:'#73A1DD',400:'#3F8AC9',500:'#0390C6',
      600:'#193B68',700:'#132E51',800:'#0F233E',900:'#0A192C' } } } } };
</script>
<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
<style type="text/tailwindcss">
  @layer base {
    html { -webkit-font-smoothing: antialiased; }
    body { @apply font-sans text-slate-800 bg-slate-50; }
  }
  @layer components {
    /* botones: usar siempre  class="btn btn-primary" | "btn btn-outline" | "btn btn-ghost" | "btn btn-danger" */
    .btn { @apply inline-flex items-center justify-center gap-2 rounded-lg px-4 py-2 text-sm font-medium transition-colors
                  focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-500/50 disabled:opacity-50 disabled:cursor-not-allowed; }
    .btn-primary { @apply bg-brand-600 text-white shadow-sm hover:bg-brand-700 active:bg-brand-800; }
    .btn-outline { @apply border border-brand-600 bg-white text-brand-600 hover:bg-brand-50; }
    .btn-ghost   { @apply text-slate-600 hover:bg-slate-100; }
    .btn-danger  { @apply bg-red-600 text-white hover:bg-red-700; }
    .btn-sm { @apply px-3 py-1.5 text-xs; }
    .card { @apply rounded-xl border border-slate-200 bg-white shadow-sm; }
    .field { @apply mt-1 block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-800 placeholder-slate-400
                    shadow-sm outline-none transition focus:border-brand-500 focus:ring-2 focus:ring-brand-500/25; }
    .field-label { @apply block text-sm font-medium text-slate-700; }
    .field-error { @apply mt-1 text-xs text-red-600; }
    .field-help { @apply mt-1 text-xs text-slate-500; }
    .badge { @apply inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium; }
    .badge-ok { @apply bg-emerald-50 text-emerald-700 ring-1 ring-inset ring-emerald-200; }
    .badge-off { @apply bg-slate-100 text-slate-600 ring-1 ring-inset ring-slate-200; }
    .page-title { @apply text-xl font-bold tracking-tight text-brand-800 sm:text-2xl; }
    .page-sub { @apply mt-1 text-sm text-slate-500; }
  }
  /* ---------- impresión: cualquier pantalla se imprime como reporte con el encabezado institucional ---------- */
  .print-only { display: none; }
  @media print {
    @page { margin: 14mm 12mm; }
    body { background: #fff !important; }
    aside, .app-topbar, .no-print, .app-footer, #modal-wrap, .app-toasts { display: none !important; }
    main.app-main { margin: 0 !important; padding: 0 !important; }
    main.app-main > div { padding: 0 !important; max-width: none !important; }
    .print-only { display: block !important; }
    .card { box-shadow: none !important; border-color: #cbd5e1 !important; }
    table { font-size: 11px; }
    thead { display: table-header-group; }
    tr { break-inside: avoid; }
    .hidden.md\:table-cell { display: table-cell !important; }
  }
</style>
