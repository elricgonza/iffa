{% if msg %}
  <p class="px-3 py-2 text-xs text-slate-500">{{ msg }}</p>
{% else %}
  {% for id, label in items %}
    <button type="button" data-id="{{ id }}" data-label="{{ label }}" @click="pick($el)"
            class="block w-full text-left px-3 py-2 text-sm hover:bg-brand-50 border-b last:border-0">{{ label }}</button>
  {% else %}
    <p class="px-3 py-2 text-xs text-slate-500">Sin resultados</p>
  {% endfor %}
{% endif %}
